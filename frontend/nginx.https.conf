# ============================================================================
# 安语（Anyu）· 前端接入层 · HTTPS 版（迭代 10 · W3）
#
# 为什么需要它：getUserMedia（喊「小伴」→ 建连 → 全双工语音）只在**安全上下文**可用。
# localhost 被浏览器豁免，但用 127.0.0.1 之外的主机名/局域网 IP 打开 pad 时，
# 没有 HTTPS 就连麦克风权限都拿不到（S-D10-5：自签证书即可，不强求 mkcert）。
#
# 挂载方式（W2 的 compose 决定，本文件只按镜像内路径写）：
#   本文件        → /etc/nginx/conf.d/default.conf
#   certs/dev.crt → /etc/nginx/certs/dev.crt   （scripts/gen_dev_cert.py 生成，certs/ 已被 .gitignore 忽略）
#   certs/dev.key → /etc/nginx/certs/dev.key
#   frontend/dist → /usr/share/nginx/html
#   <repo>/static → /srv/static               （TTS 产物，app/api/audio.py:276 回 /static/mock/…）
#   <repo>/media  → /srv/media                （媒体直连，后端无 StaticFiles 挂载）
#
# ⚠ 本文件与 nginx.conf **只能挂一个**：两者都定义 80 端口的 server，且在 http 层
#   定义同名的 `map $http_upgrade $connection_upgrade`，同时挂会 duplicate map / duplicate listen。
#
# 与 HTTP 版的差异只有四处：监听 443 + 证书、TLS 参数、80→443 跳转、HSTS（注释掉，见文内原因）。
# 其余 location（/api /ws /metrics /health /static /media /assets 与 MPA 三入口）完全一致，
# 改任何一条都要两份同步——这是两份文件而不是一份 include 的代价，换来的是
# 「一份能裸跑 HTTP、一份能跑 HTTPS」互不牵连。
# ============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# 80 → 443 跳转。
# 注意：W2 若只把 443 映射到宿主，这段就是死配置（不影响启动）；
# 若把 80 也映射出来，这就是唯一正确的行为——同域名的明文入口不该能打开页面，
# 否则用户收藏的 http:// 地址会在 getUserMedia 时无声失败。
# /healthz 例外：容器健康检查往往直接打 80，跳转会让探针拿不到 200 正文。
# ---------------------------------------------------------------------------
server {
    listen      80;
    server_name _;

    server_tokens off;

    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    server_name _;

    # 刻意不写 http2：
    #   `listen 443 ssl http2;` 在 nginx ≥ 1.25.1 已废弃（只剩警告）；
    #   `http2 on;` 在 ≤ 1.24 是未知指令，直接起不来。
    # W1 的镜像 tag 由另一个工作包决定，两种写法都可能踩空，而 WS 本来就是 HTTP/1.1，
    # 本日又不做静态资源压测——先不押版本，需要时再按实际 nginx 版本补。
    server_tokens off;

    # ------------------------------------------------------------------
    # 证书（本地自签，scripts/gen_dev_cert.py 生成）
    #   openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 365 \
    #     -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
    # SAN 里必须同时有 DNS:localhost 与 IP:127.0.0.1：只写 CN 的证书在 Chrome/Safari
    # 里会被判 NET::ERR_CERT_COMMON_NAME_INVALID（现代浏览器不看 CN）。
    # ------------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # ------------------------------------------------------------------
    # HSTS：**故意注释掉**，本机自签场景下打开会咬人。
    #
    # 原因（写在这里是为了防止后人「顺手打开」）：
    #   1) HSTS 是浏览器端的**持久**策略（默认 max-age 一年，写进 Chrome 的
    #      TransportSecurityState），清 cookie 清不掉，只能去 chrome://net-internals
    #      或删 profile 才能解除。
    #   2) 打开后 Chrome 对 localhost 也拒绝「继续前往不安全页面」的绕过按钮：
    #      自签证书 = 不受信任 → 直接 ERR_CERT_AUTHORITY_INVALID 且无法跳过，
    #      演示当场打不开页面。清理 Chrome 的 HSTS 列表才能恢复。
    #   3) 本项目的证书由 scripts/gen_dev_cert.py 每次重装/换机重新生成，
    #      指纹会变；换一次证书就锁死一次浏览器，收益（防降级）在本地为零。
    #   4) 一旦带上 includeSubDomains 或 preload，影响面还会外溢到别的本地项目。
    #
    # 真上云（有可信域名证书）时再打开，且先短后长（300 → 5184000）：
    # add_header Strict-Transport-Security "max-age=300" always;
    # ------------------------------------------------------------------

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 语音整段上传降级链路（ASR 降级时整段录音 POST）给足；默认 1m 会在 nginx 层 413，
    # 后端日志里看不到任何痕迹。
    client_max_body_size 32m;

    # 后端地址用变量 + Docker 内嵌 DNS：写死字面量时 nginx 启动即解析，
    # backend 未起会 `host not found in upstream` 退出；backend 被 recreate 换 IP 后
    # 会一直 502 到手工 reload（W6 的回滚演练正好 recreate backend）。
    # `backend` 必须与 W2 compose 的后端服务名一致。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "backend:8000";

    # 安全响应头。⚠ add_header 只在当前层级没有任何 add_header 时才继承上层，
    # 下面凡是自己写了 add_header 的 location 都把这三个头重写了一遍。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/xml application/javascript application/json
                      application/xml image/svg+xml model/gltf-binary;

    # 反代公共头（/ws/ 自己写了一套，按继承规则需连这几个一起重写）
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # nginx 自身存活探针（不依赖后端）
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # REST：/api 下全部业务接口
    location /api/ {
        proxy_pass http://$backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # /metrics 与 /health 不在 /api 下（metrics.router 前缀是 ""），漏了会拿到 index.html
    location = /metrics {
        proxy_pass http://$backend;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://$backend;
        proxy_read_timeout 10s;
    }

    # WebSocket 信令 /ws/signal（契约 A-03：无 /api 前缀），三个升级头缺一不可
    location /ws/ {
        proxy_pass http://$backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后端 TTS 产物：/static/mock/xxx.wav
    location /static/ {
        root    /srv;
        expires 1h;

        # .wav 不在官方 mime.types 里，默认会落成 application/octet-stream（见 HTTP 版同段注释）
        location ~* \.wav$ {
            default_type audio/wav;
        }
    }

    # 媒体直连；后端无 StaticFiles 挂载 → 落盘 + 404 兜底（不能被下面的 MPA 兜底成 HTML）
    location /media/ {
        root      /srv;
        try_files $uri =404;
        expires   7d;
    }

    # 带内容哈希的构建产物：长缓存 + immutable
    # （只用 add_header 不用 expires：两者都写会发出两个互相矛盾的 Cache-Control）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # .vrm/.vrma 的 MIME 必须是 model/gltf-binary（迭代 4 验收断言这一行）
    location ~* \.(?:vrm|vrma)$ {
        default_type model/gltf-binary;
        # 形象包 10.7MB：5m 会让每次刷新重下整包，弱网直接撞前端 5s 降级阈值（2026-11-09 现象）。
        # 这里不是 hash 产物，给 7d 平衡"改了形象要能生效"与"刷新不要重下"。
        expires      7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # VAD 的 wasm（sherpa-onnx）；镜像 mime.types 有 wasm 条目时以它为准
    location ~* \.wasm$ {
        default_type application/wasm;
        expires      7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # HTML 一律 no-store：否则改版后页面不刷新，旧 index.html 引用的哈希资源已不在 dist
    location ~ ^/(?:index|console|family|portal)\.html$ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # MPA 三入口：/ → index.html（pad）、/console → console.html、/family → family.html
    # （路径取自 frontend/vite.config.ts 的 rollupOptions.input 与 frontend/dist/ 实测产物）
    #
    # ⚠ 三个入口各自写全 no-store + 安全头：try_files 首参命中是「当前 location 直接出文件」、
    #   不触发内部重定向，上面那条 HTML 正则 location 兜不住它们（HTTP 版同段有实测说明）。
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /console {
        try_files $uri /console.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /family {
        try_files $uri /family.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 演示门户：/portal → dist/portal.html（工程辅助页，刻意不占用 `/`）。
    # 四个头逐条写全：add_header 不继承 + try_files 首参命中不重定向，
    # 只改 HTML 正则 location 拿不到这些头。
    location /portal {
        try_files $uri /portal.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 兜底静态 + 长者端首页回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
