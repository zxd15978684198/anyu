# ============================================================================
# 安语（Anyu）· 前端接入层 · HTTP 版（迭代 10 · W3）
#
# 挂载方式（W2 的 compose 决定，本文件只按镜像内路径写）：
#   本文件 → /etc/nginx/conf.d/default.conf（官方 nginx 镜像的 nginx.conf 已 include conf.d/*.conf）
#
# 本文件依赖三个镜像内目录，宿主路径由 compose 挂载，缺一个就少一条能力：
#   /usr/share/nginx/html  ← frontend/dist/           静态产物根（MPA 三入口 + assets）
#   /srv/static            ← <repo>/static/           后端 TTS 产出的音频
#                                                      （app/api/audio.py:276 回的是 `/static/mock/xxx.wav`，
#                                                       所以这个前缀**必须**由 nginx 直出，不能漏）
#   /srv/media             ← <repo>/media/ 或素材卷     戏曲/电影素材直连
#                                                      （app/services/media_service.py 的口径：media_url 一律
#                                                       由 nginx 静态托管、浏览器直连，后端不做 StaticFiles 挂载）
#
# ⚠ HTTP 版与 nginx.https.conf **只能挂一个**：两者都定义了 80 端口的同名 server，
#   并且都在 http 层定义了同名的 `map $http_upgrade $connection_upgrade`。
#   同时挂进来 nginx 会直接报 duplicate map / duplicate listen。
#
# 验收口径（S-D10-5）：
#   本文件负责「HTTP 能打开三端 + 反代通」，HTTPS（getUserMedia 的硬要求）在 https 版。
# ============================================================================

# WebSocket 升级头：客户端带 Upgrade 时回 upgrade，否则回 close。
# 放在 http 层（conf.d/*.conf 就是被 include 进 http 的），/ws/ 与将来的 SSE 都能复用。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    server_name _;

    # 不对外暴露 nginx 版本号（响应头与默认错误页）
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 语音整段上传降级链路（PRD/技术文档：ASR 降级时把整段录音 POST 上来）要给足。
    # 默认 1m 会直接 413，且是在 nginx 层拒掉、后端日志里看不到任何痕迹。
    client_max_body_size 32m;

    # ------------------------------------------------------------------
    # 后端地址：用变量 + Docker 内嵌 DNS，而不是写死 proxy_pass http://backend:8000;
    #
    # 写死字面量时 nginx 在**启动**解析一次主机名：backend 容器还没起来就
    # `host not found in upstream` 直接退出；backend 被 recreate（换 IP）后 nginx
    # 仍连旧 IP，表现为「后端明明 healthy，页面却 502 直到手工 reload nginx」——
    # W6 的回滚演练正好会 recreate backend，踩的就是这一条。
    # 用变量后解析推迟到每次请求（resolver 是 Docker 内嵌 DNS 127.0.0.11），
    # nginx 先起得动、后端重建后自动跟到新 IP。
    #
    # 代价：变量形式的 proxy_pass 不做 URI 归一化，原始请求 URI 原样转发
    # （本例路径只有 UUID 与常规查询串，无双重编码风险）。
    # `backend` 必须与 W2 compose 里后端服务名一致（计划 §4-W2）。
    # ------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "backend:8000";

    # ------------------------------------------------------------------
    # 安全响应头（安全基线，docs/SECURITY.md 同期口径）
    #
    # ⚠ nginx 的 add_header 只在「当前层级没有任何 add_header」时才继承上层：
    #   下面凡是自己写了 add_header 的 location，都必须把这三个头**重新写一遍**，
    #   否则那些响应会静默丢掉安全头（可 grep 本文件的 X-Content-Type-Options 数一数）。
    #
    # 刻意不加的两个头：
    #   1) Permissions-Policy —— 长者端要 getUserMedia（麦克风）。写成 microphone=()
    #      会直接把语音链路打死，写 microphone=(self) 又得跟着 iframe 场景改，
    #      本日无需求，宁可不发。
    #   2) Content-Security-Policy —— pad 里 three-vrm/VAD 要 blob: 与 wasm-unsafe-eval，
    #      收紧前得逐条验页面，超出 W3 写锁范围，登记为后续项。
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 压缩：pad 的首屏 JS/CSS 与 JSON 接口收益明显；.vrm/.wav 本身已压缩，不列进来。
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/xml application/javascript application/json
                      application/xml image/svg+xml model/gltf-binary;

    # ------------------------------------------------------------------
    # 反代公共头：放在 server 层，/api/、/metrics、/health 三个 location 直接继承。
    # /ws/ 自己又写了一套（含 Upgrade），按继承规则必须连这几个一起重写。
    # X-Forwarded-Proto 用 $scheme：HTTP 版= http，HTTPS 版自动= https，两份文件不用改。
    # ------------------------------------------------------------------
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # ------------------------------------------------------------------
    # nginx 自身的存活探针（给 W2 的 healthcheck 用）：不依赖后端、不查磁盘，
    # 只要 nginx 还能接连接就 200。后端健康与否要看 /health（下面是反代）。
    # ------------------------------------------------------------------
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------
    # REST：所有业务接口都在 /api 下（app/api/__init__.py 的 ROUTERS 注册表）。
    # 不带 URI 的 proxy_pass = 原始 URI 原样转发，所以后端看到的仍是 /api/xxx。
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://$backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # ------------------------------------------------------------------
    # /metrics 与 /health **不在 /api 下**（app/api/__init__.py：metrics.router 前缀是 ""，
    # health 同理）。vite.config.ts 的口径注释已经踩过这个坑：漏了这条，照护台的指标页
    # 会拿到 index.html 而不是 JSON。这里必须与 vite 的 dev 代理一一对应。
    # ------------------------------------------------------------------
    location = /metrics {
        proxy_pass http://$backend;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://$backend;
        proxy_read_timeout 10s;
    }

    # ------------------------------------------------------------------
    # WebSocket 信令：/ws/signal（app/audio/signaling.py:741，契约裁决 A-03：无 /api 前缀）。
    # 三个头缺一不可：HTTP/1.1 + Upgrade + Connection；少了 browser 侧握手直接失败。
    # timeout 给到 1h：信令连接是长连接，默认 60s 空闲超时会在长者发呆时莫名断开。
    # ------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://$backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade   $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 下面这五个是「本 location 有自己的 proxy_set_header，server 层的就不再继承」的补写
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------------
    # 后端产出的静态音频：/static/mock/xxx.wav（app/api/audio.py:276 返回的就是这个相对路径，
    # 文件落在仓库根的 static/ 下）。root /srv 让 /static/mock/a.wav → /srv/static/mock/a.wav。
    # 文件名带毫秒时间戳，天然唯一，1h 缓存足够且不会串音。
    # ------------------------------------------------------------------
    location /static/ {
        root    /srv;
        expires 1h;
        # 本 location 没有自己的 add_header，安全头正常继承

        # .wav 不在官方 mime.types 里，默认会落成 application/octet-stream。
        # <audio> 播放多数浏览器能靠嗅探过关，但「能播」和「Content-Type 正确」是两件事，
        # 演示时若用 Safari / 车机浏览器就可能静默不播。嵌套 location 继承外层 root 与 expires，
        # 只改类型，不动路径。
        location ~* \.wav$ {
            default_type audio/wav;
        }
    }

    # ------------------------------------------------------------------
    # 媒体直连：戏曲/电影素材（PRD §2.1 媒体分发，media_url 由 nginx 直出）。
    #
    # 后端**没有** StaticFiles 挂载（grep 过 app/：无 mount() 调用），所以这里不反代，
    # 直接落盘；try_files 的 =404 是兜底：素材卷没挂或没有该素材时干净地 404，
    # 而不是被下面的 MPA 兜底 location 兜成 index.html（那会让 <audio> 收到 HTML，
    # 表现为「无声但也不报错」，最难查）。
    #
    # 素材目录缺省是 <repo>/media/，W2 挂到 /srv/media（宿主没有该目录时 compose 会建空目录）。
    # ------------------------------------------------------------------
    location /media/ {
        root      /srv;
        try_files $uri =404;
        expires   7d;
        # 不写 add_header：断点续播要的 Accept-Ranges 是 nginx 静态模块自带的，
        # 手写一个反而会让本 location 丢掉 server 层的安全头（见上面的继承说明）。
    }

    # ------------------------------------------------------------------
    # 构建产物里唯一带内容哈希的目录（vite 默认 assets/），可以放心 immutable。
    # 与 HTML 的 no-store 是一对：改版后 index.html 立即刷新、引用到的哈希文件长缓存。
    # ------------------------------------------------------------------
    location /assets/ {
        # 只用 add_header 不用 expires：两者都写会发出两个互相矛盾的 Cache-Control
        # （实测 `Cache-Control: max-age=31536000` 与 `... immutable` 并列）。
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # 本 location 有 add_header → server 层的安全头不再继承，逐个补写
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ------------------------------------------------------------------
    # 3D 模型与动作：.vrm / .vrma 在官方 mime.types 里**没有**条目，默认会落成
    # application/octet-stream。迭代 4 的验收就是 `curl -sI ... | grep -i content-type`
    # 必须回 model/gltf-binary（deploy/nginx.conf 的同一条口径）。
    #
    # 这里用 default_type 而不是 `types { model/gltf-binary vrm; }`：default_type 只在
    # 「扩展名不在 types 表里」时生效，语义确定、不依赖 types 块在各层的合并行为。
    # 缓存给 5m 而不是 1y：形象文件同名替换时，前端靠 avatar-config 的 version 指纹失效，
    # 这里刻意不留 immutable（与 deploy/nginx.conf 的 max-age=300 同口径）。
    # ------------------------------------------------------------------
    location ~* \.(?:vrm|vrma)$ {
        default_type model/gltf-binary;
        # 形象包 10.7MB：原文给 5m 会让每次刷新重下整包，弱网撞前端 5s 降级阈值。
        # 不是 hash 产物，给 7d 平衡"改形象要生效"与"刷新不要重下"（2026-11-09）。
        expires      7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ------------------------------------------------------------------
    # VAD 的 wasm（frontend/public/vad-assets/，sherpa-onnx）。Content-Type 不对时
    # WebAssembly.instantiateStreaming 会退化成「先下载再实例化」的慢路径（不致命但有代价）。
    # 同样用 default_type 兜底：镜像的 mime.types 里有 wasm 条目时以它为准，没有就用这条。
    # ------------------------------------------------------------------
    location ~* \.wasm$ {
        default_type application/wasm;
        expires      7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ------------------------------------------------------------------
    # HTML 一律不缓存。
    #
    # 不这么做的直接后果：改版后浏览器拿 304 复用旧 index.html，而旧的 assets 名字
    # 已经不在新 dist 里 → 白屏或 404，且「Ctrl+F5 就好」这种结论会被误当成前端 bug。
    # no-store 比 no-cache 更狠：连条件请求都不发（no-cache 仍会回 304）。
    # ------------------------------------------------------------------
    location ~ ^/(?:index|console|family|portal)\.html$ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ------------------------------------------------------------------
    # MPA 三入口 —— 路径按 vite.config.ts 的 rollupOptions.input 与真实产物写，
    # 不是猜的：
    #   input: pad → index.html | console → console.html | family → family.html
    #   产物（frontend/dist/ 实测）：index.html、console.html、family.html 三个**文件在根**，
    #   不是 /console/index.html 那种目录形态。
    # 页面里引用的资源是绝对路径（/assets/console-xxxx.js），所以 /console/ 这种子路径
    # 也能正常取到资源，不需要给每个入口单独 root。
    # 三端目前都**没有**前端路由（grep 过 frontend/src：无 react-router / BrowserRouter），
    # 因此 /console/whatever 也回 console.html 只是顺带，不承担路由语义。
    #
    # ⚠ 实测（nginx 1.31.8，docker 容器实测响应头）：try_files 的**首个参数命中**时是
    #   「在当前 location 里直接出文件」，**不会**触发内部重定向，所以上面那条 HTML
    #   正则 location 兜不住这些入口（它只对直接请求 /index.html 生效）。
    #   于是下面三个入口 location 各自把 no-store 与三个安全头写全——这是 add_header
    #   不继承 + try_files 不重定向两条规则叠加后的必然结果，不是复制粘贴的疏忽。
    # ------------------------------------------------------------------

    # 长者端：/ → dist/index.html
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 照护台：/console、/console/、/console/xxx → dist/console.html
    # （prefix 而非 exact：带不带斜杠都能进，少一次 301 往返）
    location /console {
        try_files $uri /console.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 家属端：/family、/family/、/family/xxx → dist/family.html
    location /family {
        try_files $uri /family.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 演示门户：/portal、/portal/、/portal/xxx → dist/portal.html
    # 工程辅助页（前端计划 §10 批次 WP），**刻意不占用 `/`**：根地址仍是长者端，
    # 保住「开机即数字人」的设备语义。四个头必须在这里逐条写全 ——
    # add_header 不继承 + try_files 首参命中不触发内部重定向（见上方 ⚠ 实测说明），
    # 只改上面那条 HTML 正则 location 是拿不到 no-store 与安全头的。
    location /portal {
        try_files $uri /portal.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 兜底：其余静态文件（favicon、avatars/fallback.png、avatars/animations/manifest.json…）
    # 直接按磁盘取；取不到才回长者端首页（保持「pad 刷新任何路径都不白屏」）。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
