# Generated by gatekeeper / py-ci-render.
# Python + uv, not the Node-era template: the sync step installs exactly what
# uv.lock pins, so CI and local runs resolve the same versions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 测试套件要真库：`tests/conftest.py` 的 `require_db_connection()` 连不上 PostgreSQL 时
    # **一律 pytest.fail**（默认不 skip —— skip 的退出码仍是 0，会让 96 个用 `db_conn` 的文件
    # 静默消失）。workflow 由模板渲染时没有 services 段，pytest 在 runner 上连 localhost:5432
    # 直接被拒，Test 步骤必然红，这是本仓库 CI 第一次跑就失败的原因。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: anyu
          POSTGRES_PASSWORD: anyu
          POSTGRES_DB: anyu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anyu -d anyu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # 与 `app/core/config.py` 的默认值同形，只把 `localhost` 换成 `127.0.0.1`
      # （runner 上 `localhost` 先解析 ::1，与 conftest 的 `_force_ipv4_loopback` 同一理由）。
      DATABASE_URL: postgresql+asyncpg://anyu:anyu@127.0.0.1:5432/anyu
      LANGGRAPH_CHECKPOINT_DATABASE_URL: postgresql://anyu:anyu@127.0.0.1:5432/anyu
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Lock check (uv lock --check)
        run: uv lock --check

      - name: Install dependencies (uv sync --locked --all-groups)
        run: uv sync --locked --all-groups

      - name: Lint (ruff check + ruff format --check)
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Type check
        run: uv run --locked mypy app mcp-servers

      - name: Version manifest (python scripts/validate_version_manifest.py)
        run: uv run --locked python scripts/validate_version_manifest.py

      # `pgvector/pgvector:pg16` 只把扩展文件装进镜像，不替库建扩展（实测全新库只有
      # plpgsql）。迁移 0009 要建 `VECTOR(1536)` 列，缺扩展会报 `type "vector" does not
      # exist`，所以必须在迁移前显式建一次；`IF NOT EXISTS` 保证可重复执行。
      # 本地第一次起 compose 的 postgres 时由 `deploy/postgres/init/01-pgvector.sql` 完成。
      - name: Enable pgvector extension
        run: psql "postgresql://anyu:anyu@127.0.0.1:5432/anyu" -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # 服务容器里的库是空的：业务表由迁移建，不跑这一步 pytest 会红在「表不存在」。
      # 本地由开发者手动做（README §5 的 `alembic upgrade head`），所以它在 ci.py 的
      # 阶段表里没有对应项，已在 `scripts/check_gate_sync.py` 的 WORKFLOW_ONLY_PREFIXES 登记。
      - name: Apply migrations (alembic upgrade head)
        run: uv run --locked alembic upgrade head

      - name: Test (pytest)
        env:
          # 临时诊断：把 junit 与覆盖率报告写到 /tmp，供下一步转成注解（定位完即删）
          PYTEST_ADDOPTS: "--junitxml=/tmp/junit.xml --cov-report=xml:/tmp/coverage.xml"
        run: uv run --locked pytest --cov --cov-report=term-missing

      # 临时诊断：无 Actions 日志读取权限时，靠注解拿到「哪些用例红了 + 覆盖率多少」
      - name: Diagnose pytest failures
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          if os.path.exists("/tmp/coverage.xml"):
              try:
                  root = ET.parse("/tmp/coverage.xml").getroot()
                  print(f"::error::coverage={float(root.get('line-rate')) * 100:.2f}%")
              except Exception as exc:  # noqa: BLE001
                  print(f"::error::coverage-parse-failed {exc}")
          else:
              print("::error::coverage.xml-missing")

          if not os.path.exists("/tmp/junit.xml"):
              print("::error::junit.xml-missing")
              raise SystemExit(0)

          bad = []
          for case in ET.parse("/tmp/junit.xml").getroot().iter("testcase"):
              if case.find("failure") is not None or case.find("error") is not None:
                  bad.append(f"{case.get('classname')}::{case.get('name')}")
          print(f"::error::failed-count={len(bad)}")
          for name in bad[:25]:
              print(f"::error::{name}")
          PY

      # 前端单测：与 scripts/ci.py 的 test 阶段第二步骤逐 argv 一致（check_gate_sync 双向比对）。
      # 只跑 Node 内建 test runner；`scripts/node-ts-hook.mjs` 用项目已有的 typescript
      # devDependency 转译 pad 的 TS 源码，所以必须先装 frontend 依赖（不新增任何依赖）。
      # `scripts/run-frontend-tests.mjs` 是零用例守卫：它先按 frontend/src 与 frontend/tests
      # 两个根目录列出用例文件（.mjs 可以在 src，.ts 只能进 tests —— tsconfig 的 include 只有
      # src 且 types 只有 vite/client，.ts 用例进 src 会让 pnpm build 的 tsc 报 TS2307），
      # 文件数为 0 或跑出来用例数为 0 都以 1 退出，堵住 `node --test` 对空 glob 返回 0 的假绿。
      - name: Setup Node (frontend unit tests)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Frontend unit tests (node --test, zero-test guarded)
        run: node scripts/run-frontend-tests.mjs

      - name: Secret scan (python scripts/secret_scan.py)
        run: uv run --locked python scripts/secret_scan.py

      # 覆盖上游默认：本项目是应用不是可分发包
      # （`[tool.uv] package = false` 且无 `[build-system]`），`uv build` 必然报
      # "Multiple top-level packages discovered"。阶段语义保留为「要交付的东西真能从已提交源码
      # 物化出来」：冻结依赖导出 + `app.main` 装配冒烟。与 scripts/ci.py 的 build 阶段逐 argv 一致。
      - name: Build (clear dist/ + export requirements + import smoke)
        run: |
          uv run python -c 'import shutil,sys; shutil.rmtree(sys.argv[1], ignore_errors=True)' dist
          uv export --frozen --no-dev --format requirements-txt -o dist/requirements.txt
          uv run --locked python -c "import app.main; print('routes:', len(app.main.app.routes))"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
