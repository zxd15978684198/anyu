# Generated by gatekeeper / py-ci-render.
# Python + uv, not the Node-era template: the sync step installs exactly what
# uv.lock pins, so CI and local runs resolve the same versions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Lock check (uv lock --check)
        run: uv lock --check

      - name: Install dependencies (uv sync --locked --all-groups)
        run: uv sync --locked --all-groups

      - name: Lint (ruff check + ruff format --check)
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Type check
        run: uv run --locked mypy app mcp-servers

      - name: Version manifest (python scripts/validate_version_manifest.py)
        run: uv run --locked python scripts/validate_version_manifest.py

      - name: Test (pytest)
        run: uv run --locked pytest --cov --cov-report=term-missing

      # 前端单测：与 scripts/ci.py 的 test 阶段第二步骤逐 argv 一致（check_gate_sync 双向比对）。
      # 只跑 Node 内建 test runner；`scripts/node-ts-hook.mjs` 用项目已有的 typescript
      # devDependency 转译 pad 的 TS 源码，所以必须先装 frontend 依赖（不新增任何依赖）。
      # `scripts/run-frontend-tests.mjs` 是零用例守卫：它先按 frontend/src 与 frontend/tests
      # 两个根目录列出用例文件（.mjs 可以在 src，.ts 只能进 tests —— tsconfig 的 include 只有
      # src 且 types 只有 vite/client，.ts 用例进 src 会让 pnpm build 的 tsc 报 TS2307），
      # 文件数为 0 或跑出来用例数为 0 都以 1 退出，堵住 `node --test` 对空 glob 返回 0 的假绿。
      - name: Setup Node (frontend unit tests)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Frontend unit tests (node --test, zero-test guarded)
        run: node scripts/run-frontend-tests.mjs

      - name: Secret scan (python scripts/secret_scan.py)
        run: uv run --locked python scripts/secret_scan.py

      # 覆盖上游默认：本项目是应用不是可分发包
      # （`[tool.uv] package = false` 且无 `[build-system]`），`uv build` 必然报
      # "Multiple top-level packages discovered"。阶段语义保留为「要交付的东西真能从已提交源码
      # 物化出来」：冻结依赖导出 + `app.main` 装配冒烟。与 scripts/ci.py 的 build 阶段逐 argv 一致。
      - name: Build (clear dist/ + export requirements + import smoke)
        run: |
          uv run python -c 'import shutil,sys; shutil.rmtree(sys.argv[1], ignore_errors=True)' dist
          uv export --frozen --no-dev --format requirements-txt -o dist/requirements.txt
          uv run --locked python -c "import app.main; print('routes:', len(app.main.app.routes))"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
